<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rút gọn link và tạo mã QR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body class="home">
<main>
  <div class="grid">
    <section>
      <h1>Dán link dài. Lấy link ngắn và mã QR.</h1>
      <p class="lead">Không cần đăng ký. Mỗi link có sẵn mã QR, kèm số lượt truy cập và lượt quét QR để theo dõi.</p>
      <form id="f">
        <input id="url" type="url" placeholder="Dán link cần rút gọn" aria-label="Link cần rút gọn" required>
        <button id="go">Rút gọn</button>
      </form>
      <details><summary>Đặt tên riêng cho link</summary>
        <input id="alias" placeholder="vd: khuyen-mai (3-32 ký tự)" aria-label="Tên riêng">
      </details>
      <div id="err" class="err" role="alert"></div>
    </section>
    <section id="panel" class="panel" aria-live="polite">
      <p class="hint">Mã QR và link ngắn của bạn sẽ hiện ở đây.</p>
    </section>
  </div>
  <h2>Link gần đây trên máy này</h2>
  <ul id="hist"></ul>
</main>
<script>
const $ = (s) => document.querySelector(s);
const h = (t, p = {}, ...k) => { const n = Object.assign(document.createElement(t), p); n.append(...k); return n; };
const KEY = "short_history";
const load = () => { try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch { return []; } };
const save = (a) => { try { localStorage.setItem(KEY, JSON.stringify(a.slice(0, 8))); } catch {} };

function copyBtn(text) {
  const b = h("button", { className: "btn", type: "button", textContent: "Sao chép" });
  b.onclick = async () => { await navigator.clipboard.writeText(text); b.textContent = "Đã sao chép"; setTimeout(() => (b.textContent = "Sao chép"), 1500); };
  return b;
}
function showResult(d) {
  const p = $("#panel"); p.className = "panel on";
  p.replaceChildren(
    h("img", { src: d.qr_url, alt: "Mã QR của " + d.short_url, width: 220, height: 220 }),
    h("a", { className: "short", href: d.short_url, target: "_blank", rel: "noopener", textContent: d.short_url }),
    h("div", { className: "row" }, copyBtn(d.short_url),
      h("a", { className: "btn ghost", href: d.qr_url + "&format=svg&download=1", textContent: "Tải SVG" }),
      h("a", { className: "btn ghost", href: d.qr_url + "&format=png&download=1", textContent: "Tải PNG" })));
}
function renderHist() {
  const ul = $("#hist"), items = load(); ul.replaceChildren();
  if (!items.length) return ul.append(h("li", { className: "empty", textContent: "Chưa có link nào. Link bạn tạo sẽ được nhớ ở đây." }));
  for (const it of items) {
    const stat = h("small", { textContent: it.url });
    const btn = h("button", { type: "button", textContent: "Xem số liệu" });
    btn.onclick = async () => {
      const r = await fetch("/api/stats?code=" + it.code), d = await r.json();
      stat.textContent = r.ok ? `${d.clicks} lượt truy cập, trong đó ${d.scans} lượt quét QR` : d.error;
      btn.remove();
    };
    ul.append(h("li", {}, h("a", { href: it.short_url, target: "_blank", rel: "noopener", textContent: it.short_url }), stat, btn));
  }
}
$("#f").addEventListener("submit", async (e) => {
  e.preventDefault();
  const go = $("#go"), err = $("#err"); err.textContent = ""; go.disabled = true; go.textContent = "Đang tạo...";
  try {
    const r = await fetch("/api/shorten", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ url: $("#url").value, alias: $("#alias").value || undefined }) });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || "Không tạo được link");
    showResult(d); save([d, ...load()]); renderHist(); $("#url").value = ""; $("#alias").value = "";
  } catch (x) { err.textContent = x.message; }
  go.disabled = false; go.textContent = "Rút gọn";
});
renderHist();
</script>
<!-- Vercel Web Analytics + Speed Insights (bật ở dashboard: Analytics, Speed Insights) -->

<script defer src="/_vercel/insights/script.js"></script>
<script>window.si = window.si || function () { (window.siq = window.siq || []).push(arguments); };</script>
<script defer src="/_vercel/speed-insights/script.js"></script>
</body>
</html>
