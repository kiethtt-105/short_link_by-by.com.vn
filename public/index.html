<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rút gọn link và tạo mã QR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#0e1a2b;--paper:#f3f6fb;--card:#fff;--line:#d9e0ec;--blue:#2b59ff;--ok:#0f9d6e;--bad:#d92d20;--muted:#5b6b82;color-scheme:light dark}
@media(prefers-color-scheme:dark){:root{--ink:#e8eefc;--paper:#0b1220;--card:#121b2e;--line:#2a3a5c;--blue:#7b97ff;--ok:#34d399;--bad:#f87171;--muted:#93a3bf}}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 "Be Vietnam Pro",system-ui,sans-serif}
main{max-width:1040px;margin:0 auto;padding:9vh 20px 72px}
.grid{display:grid;grid-template-columns:1.1fr .9fr;gap:48px;align-items:start}
@media(max-width:820px){.grid{grid-template-columns:1fr;gap:32px}}
h1{font-size:clamp(34px,5.6vw,60px);line-height:1.06;font-weight:800;letter-spacing:-.03em;margin:0 0 16px}
.lead{color:var(--muted);max-width:44ch;margin:0 0 28px}
form{display:flex;background:var(--card);border:2px solid var(--ink);border-radius:14px;overflow:hidden}
input{font:inherit;color:inherit;background:transparent;border:0;padding:16px;min-width:0}
#url{flex:1}
button,.btn{font:inherit;font-weight:500;border:0;cursor:pointer;text-decoration:none;display:inline-block}
form button{background:var(--blue);color:#fff;padding:0 26px}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
details{margin:12px 2px;color:var(--muted)}
summary{cursor:pointer}
#alias{margin-top:8px;border:1px solid var(--line);border-radius:10px;width:100%;max-width:360px}
#err{color:var(--bad);min-height:1.5em;margin:8px 2px}
.panel{background:var(--card);border:2px dashed var(--line);border-radius:18px;padding:28px;text-align:center;min-height:360px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.panel.on{border:2px solid var(--ink)}
.panel img{border-radius:10px;background:#fff;padding:8px}
.hint{color:var(--muted);max-width:26ch}
.short{font-weight:800;font-size:20px;color:var(--blue);word-break:break-all}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.btn{padding:9px 16px;border-radius:9px;background:var(--ink);color:var(--paper)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
h2{font-size:20px;margin:56px 0 12px}
ul{list-style:none;padding:0;margin:0;border-top:1px solid var(--line)}
li{padding:14px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:1fr auto;gap:4px 16px}
li a{color:var(--blue);font-weight:500;word-break:break-all}
li small{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;grid-column:1}
li button{background:none;color:var(--ink);text-decoration:underline;padding:0;grid-row:1/3;grid-column:2}
.empty{color:var(--muted)}
</style>
</head>
<body>
<main>
  <div class="grid">
    <section>
      <h1>Dán link dài. Lấy link ngắn và mã QR.</h1>
      <p class="lead">Không cần đăng ký. Mỗi link có sẵn mã QR và số lượt bấm, lượt quét để theo dõi.</p>
      <form id="f">
        <input id="url" type="url" placeholder="Dán link cần rút gọn" aria-label="Link cần rút gọn" required>
        <button id="go">Rút gọn</button>
      </form>
      <details><summary>Đặt tên riêng cho link</summary>
        <input id="alias" placeholder="vd: khuyen-mai (3-32 ký tự)" aria-label="Tên riêng">
      </details>
      <div id="err" role="alert"></div>
    </section>
    <section id="panel" class="panel" aria-live="polite">
      <p class="hint">Mã QR và link ngắn của bạn sẽ hiện ở đây.</p>
    </section>
  </div>
  <h2>Link gần đây trên máy này</h2>
  <ul id="hist"></ul>
</main>
<script>
const $ = (s) => document.querySelector(s);
const h = (t, p = {}, ...k) => { const n = Object.assign(document.createElement(t), p); n.append(...k); return n; };
const KEY = "short_history";
const load = () => { try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch { return []; } };
const save = (a) => { try { localStorage.setItem(KEY, JSON.stringify(a.slice(0, 8))); } catch {} };

function copyBtn(text) {
  const b = h("button", { className: "btn", type: "button", textContent: "Sao chép" });
  b.onclick = async () => { await navigator.clipboard.writeText(text); b.textContent = "Đã sao chép"; setTimeout(() => (b.textContent = "Sao chép"), 1500); };
  return b;
}
function showResult(d) {
  const p = $("#panel"); p.className = "panel on";
  p.replaceChildren(
    h("img", { src: d.qr_url, alt: "Mã QR của " + d.short_url, width: 220, height: 220 }),
    h("a", { className: "short", href: d.short_url, target: "_blank", rel: "noopener", textContent: d.short_url }),
    h("div", { className: "row" }, copyBtn(d.short_url),
      h("a", { className: "btn ghost", href: d.qr_url + "&format=svg&download=1", textContent: "Tải SVG" }),
      h("a", { className: "btn ghost", href: d.qr_url + "&format=png&download=1", textContent: "Tải PNG" })));
}
function renderHist() {
  const ul = $("#hist"), items = load(); ul.replaceChildren();
  if (!items.length) return ul.append(h("li", { className: "empty", textContent: "Chưa có link nào. Link bạn tạo sẽ được nhớ ở đây." }));
  for (const it of items) {
    const stat = h("small", { textContent: it.url });
    const btn = h("button", { type: "button", textContent: "Xem số liệu" });
    btn.onclick = async () => {
      const r = await fetch("/api/stats?code=" + it.code), d = await r.json();
      stat.textContent = r.ok ? `${d.clicks} lượt bấm, ${d.scans} lượt quét QR` : d.error;
      btn.remove();
    };
    ul.append(h("li", {}, h("a", { href: it.short_url, target: "_blank", rel: "noopener", textContent: it.short_url }), stat, btn));
  }
}
$("#f").addEventListener("submit", async (e) => {
  e.preventDefault();
  const go = $("#go"), err = $("#err"); err.textContent = ""; go.disabled = true; go.textContent = "Đang tạo...";
  try {
    const r = await fetch("/api/shorten", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ url: $("#url").value, alias: $("#alias").value || undefined }) });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || "Không tạo được link");
    showResult(d); save([d, ...load()]); renderHist(); $("#url").value = "";
  } catch (x) { err.textContent = x.message; }
  go.disabled = false; go.textContent = "Rút gọn";
});
renderHist();
</script>
</body>
</html>
