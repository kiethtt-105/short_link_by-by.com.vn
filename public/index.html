<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rút gọn link</title>
<style>
  :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
  body { max-width: 560px; margin: 12vh auto; padding: 0 16px; }
  h1 { margin-bottom: 4px; }
  form { display: flex; flex-direction: column; gap: 8px; margin-top: 16px; }
  input, button { padding: 12px; font-size: 16px; border-radius: 8px; border: 1px solid #8886; }
  button { background: #2563eb; color: #fff; border: 0; cursor: pointer; }
  #out { margin-top: 16px; word-break: break-all; }
  .err { color: #dc2626; }
</style>
</head>
<body>
<h1>Rút gọn link</h1>
<p>Dán link dài, nhận link ngắn.</p>
<form id="f">
  <input id="url" type="url" placeholder="https://..." required>
  <input id="alias" placeholder="Tên tuỳ chọn (3-32 ký tự, có thể bỏ trống)">
  <button>Rút gọn</button>
</form>
<div id="out"></div>
<script>
const out = document.getElementById("out");
document.getElementById("f").addEventListener("submit", async (e) => {
  e.preventDefault();
  out.textContent = "Đang xử lý...";
  try {
    const r = await fetch("/api/shorten", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ url: url.value, alias: alias.value || undefined }),
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || "Lỗi");
    out.innerHTML = "";
    const a = document.createElement("a");
    a.href = d.short_url; a.textContent = d.short_url; a.target = "_blank";
    const b = document.createElement("button");
    b.type = "button"; b.textContent = "Sao chép"; b.style.marginLeft = "8px";
    b.onclick = () => navigator.clipboard.writeText(d.short_url);
    const img = document.createElement("img");
    img.src = d.qr_url; img.alt = "Mã QR"; img.width = 200; img.height = 200;
    img.style.display = "block"; img.style.margin = "16px 0 8px";
    const dl = document.createElement("div");
    for (const [label, q] of [["Tải SVG", "&format=svg&download=1"], ["Tải PNG", "&format=png&download=1"]]) {
      const l = document.createElement("a");
      l.href = d.qr_url + q; l.textContent = label; l.style.marginRight = "12px";
      dl.append(l);
    }
    out.append(a, b, img, dl);
  } catch (err) {
    out.innerHTML = ""; const s = document.createElement("span");
    s.className = "err"; s.textContent = err.message; out.append(s);
  }
});
</script>
</body>
</html>
